services:
  salon:
    build:
      context: .
      dockerfile: Dockerfile.selfhost
    restart: unless-stopped
    env_file: .env.selfhost
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
